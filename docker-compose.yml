version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: codigoatendechat-postgres
    environment:
      POSTGRES_USER: codigoatendechat
      POSTGRES_PASSWORD: codigoatendechat123
      POSTGRES_DB: codigoatendechat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codigoatendechat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codigoatendechat-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass 123456
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
